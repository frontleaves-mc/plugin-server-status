syntax = "proto3";

package frontleaves.status.v1;

option go_package = "github.com/frontleaves-mc/frontleaves-plugin/internal/grpc/gen/status/v1;statuspb";
option java_package = "com.frontleaves.plugins.status.grpc.generated";
option java_outer_classname = "ServerStatusProto";

import "link/base.proto";

// ServerStatusService 服务器状态服务
//
// 使用 Client Stream 接收 Java 插件持续上报的心跳事件，
// 携带 TPS、CPU、内存、磁盘、JVM、版本和世界信息。
service ServerStatusService {
  // ServerEventStream 事件上报流（Client Stream）
  // Java 插件建立一次连接后持续发送心跳事件
  rpc ServerEventStream(stream ServerEventStreamRequest) returns (ServerEventStreamResponse);
}

// ServerEventType 事件类型枚举
enum ServerEventType {
  // 未知事件
  SERVER_EVENT_TYPE_UNSPECIFIED = 0;
  // 心跳
  SERVER_EVENT_TYPE_HEARTBEAT = 1;
}

// ServerEventStreamRequest 事件上报流请求
message ServerEventStreamRequest {
  // 事件类型
  ServerEventType event_type = 1;
  // 具体事件数据
  oneof event {
    // 心跳事件
    HeartbeatEvent heartbeat_event = 11;
  }
}

// ServerEventStreamResponse 事件上报流响应
// 服务端在流关闭时返回最终确认
message ServerEventStreamResponse {
  // 基础响应
  xBase.BaseResponse base_response = 1;
}

// HeartbeatEvent 心跳事件
message HeartbeatEvent {
  // 服务器名称
  string server_name = 1;
  // 服务器 TPS
  double tps = 2;
  // 在线玩家数量
  int32 online_player = 3;
  // CPU 信息
  CpuInfo cpu_info = 5;
  // 内存信息
  MemoryInfo memory_info = 6;
  // 磁盘信息
  DiskInfo disk_info = 7;
  // JVM 信息
  JvmInfo jvm_info = 8;
  // 版本信息
  ServerVersionInfo version_info = 9;
  // 世界列表
  repeated WorldInfo worlds = 10;
}

// CpuInfo CPU 信息
message CpuInfo {
  // CPU 核心数
  int32 cores = 1;
  // CPU 使用率（百分比）
  double usage_percent = 2;
}

// MemoryInfo 内存信息
message MemoryInfo {
  // 总内存（字节）
  int64 total_bytes = 1;
  // 已用内存（字节）
  int64 used_bytes = 2;
  // 空闲内存（字节）
  int64 free_bytes = 3;
}

// DiskInfo 磁盘信息
message DiskInfo {
  // 总磁盘空间（字节）
  int64 total_bytes = 1;
  // 已用磁盘空间（字节）
  int64 used_bytes = 2;
}

// JvmInfo JVM 信息
message JvmInfo {
  // JVM 最大内存（字节）
  int64 max_memory_bytes = 1;
  // JVM 已用内存（字节）
  int64 used_memory_bytes = 2;
}

// ServerVersionInfo 服务器版本信息
message ServerVersionInfo {
  // 服务器版本
  string server_version = 1;
  // Minecraft 版本
  string mc_version = 2;
}

// WorldInfo 世界信息
message WorldInfo {
  // 世界名称
  string world_name = 1;
  // 玩家数量
  int32 player_count = 2;
  // 实体数量
  int32 entity_count = 3;
  // 已加载区块数
  int32 loaded_chunks = 4;
}
